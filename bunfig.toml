# The engine's tests from the root (`bun run check`): the preload that removes the fixtures the tests
# made when the run ends (finding 74). The timeout is the script's `--timeout 30000`: bun 1.3.9 reads
# no timeout key here. The engine's own bunfig.toml names the same preload for the engine target's `bun test`.
[test]
preload = ["./packages/engine/tests/preload.ts"]
